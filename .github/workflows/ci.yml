name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace

      - name: test
        run: cargo test --workspace

      - name: runbox-helper dependency guard
        run: python3 scripts/check_helper_deps.py

  env-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify required macOS tooling is present
        run: python3 scripts/check_env.py --ci
